<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Proxy</title>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #1e1e2e;
      color: white;
    }
    .toolbar {
      display: flex;
      padding: 10px;
      background-color: #2b2b3b;
      gap: 10px;
    }
    .toolbar input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #181825;
      color: #fff;
      font-size: 16px;
    }
    .toolbar button {
      padding: 10px 20px;
      border: none;
      background-color: #89b4fa;
      color: #11111b;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .toolbar button:hover {
      background-color: #b4befe;
    }
    .viewport {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="text" id="urlInput" placeholder="Enter URL or search query..." />
    <button onclick="navigate()">Go</button>
  </div>

  <iframe id="browserWindow" class="viewport" src="about:blank"></iframe>

  <script>
    async function initSW() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('/uv/uv.sw.js', {
            scope: __uv$config.prefix
          });
        } catch (err) {
          console.error('ServiceWorker registration failed:', err);
        }
      }
    }
    initSW();

    function navigate() {
      let query = document.getElementById('urlInput').value.trim();
      if (!query) return;

      let url = query;
      if (!/^https?:\/\//i.test(url)) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
        }
      }

      const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
      document.getElementById('browserWindow').src = encodedUrl;
    }

    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') navigate();
    });
  </script>
</body>
</html>
