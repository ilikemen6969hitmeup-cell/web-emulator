<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Emulator</title>
  <style>
    :root {
      --bg-dark: #12131c;
      --panel-bg: #1e2030;
      --input-bg: #2a2d43;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --border: #313244;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-dark); color: var(--text); overflow: hidden; }

    /* Browser Header & Toolbar */
    .browser-header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn:hover { background: #363a57; }

    .address-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
    }

    .address-bar-container input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      padding: 10px;
      font-size: 14px;
    }

    /* Shortcut Bar */
    .shortcuts {
      display: flex;
      gap: 8px;
      padding-left: 2px;
    }

    .shortcut-chip {
      background: var(--input-bg);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .shortcut-chip:hover { background: #363a57; }

    /* Main Viewport */
    .viewport-container {
      flex: 1;
      position: relative;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="browser-header">
    <div class="toolbar">
      <button class="btn" onclick="goBack()">&#129144;</button>
      <button class="btn" onclick="goForward()">&#129146;</button>
      <button class="btn" onclick="reloadFrame()">&#128472;</button>
      
      <div class="address-bar-container">
        <input type="text" id="urlInput" placeholder="Search with DuckDuckGo or enter URL (e.g. wikipedia.org)..." />
      </div>

      <button class="btn" style="background: var(--accent); color: #111;" onclick="navigate()">Go</button>
    </div>

    <div class="shortcuts">
      <span class="shortcut-chip" onclick="quickLoad('https://start.duckduckgo.com')">DuckDuckGo</span>
      <span class="shortcut-chip" onclick="quickLoad('https://en.m.wikipedia.org')">Wikipedia</span>
      <span class="shortcut-chip" onclick="quickLoad('https://archive.org')">Archive.org</span>
    </div>
  </div>

  <div class="viewport-container">
    <iframe id="browserViewport" src="about:blank"></iframe>
  </div>

  <script>
    const iframe = document.getElementById('browserViewport');
    const input = document.getElementById('urlInput');

    function navigate() {
      let query = input.value.trim();
      if (!query) return;

      let targetUrl = query;
      if (!query.includes('.') || query.includes(' ')) {
        targetUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query);
      } else if (!/^https?:\/\//i.test(targetUrl)) {
        targetUrl = 'https://' + targetUrl;
      }

      iframe.src = '/proxy?url=' + encodeURIComponent(targetUrl);
    }

    function quickLoad(url) {
      input.value = url;
      navigate();
    }

    function goBack() { iframe.contentWindow.history.back(); }
    function goForward() { iframe.contentWindow.history.forward(); }
    function reloadFrame() { iframe.contentWindow.location.reload(); }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') navigate();
    });
  </script>
</body>
</html>
