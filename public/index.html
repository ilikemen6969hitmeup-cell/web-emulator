<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="tabTitle">Joe</title>
  <link id="tabIcon" rel="icon" href="data:," />
  
  <!-- Load Ultraviolet Core Scripts -->
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js" onerror="console.warn('uv.config.js not found, using inline config fallback')"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Main Home Container */
    .main-container {
      width: 100%;
      max-width: 650px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .options-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    select {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #38bdf8;
    }

    .search-box {
      display: flex;
      gap: 10px;
      background: #1e293b;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      padding: 10px 15px;
      font-size: 16px;
    }

    .search-box button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background: #0ea5e9;
    }

    /* Fullscreen Viewport Overlay */
    #viewportContainer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      flex-direction: column;
      z-index: 9999;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .top-nav button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .top-nav button:hover {
      background: #475569;
    }

    .top-nav input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .top-nav input:focus {
      border-color: #38bdf8;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Home View -->
  <div class="main-container">
    <h1>Joe Proxy</h1>
    
    <div class="options-row">
      <select id="engineSelect">
        <option value="google">Search: Google</option>
        <option value="bing">Search: Bing</option>
        <option value="duckduckgo">Search: DuckDuckGo</option>
      </select>

      <select onchange="applyCloak(this.value)">
        <option value="default">Tab Cloak: Normal</option>
        <option value="google">Google</option>
        <option value="drive">Google Drive</option>
        <option value="classroom">Google Classroom</option>
      </select>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search the web or type a URL..." />
      <button onclick="launchUrl(document.getElementById('searchInput').value)">Go</button>
    </div>
  </div>

  <!-- Browser Overlay Viewport -->
  <div id="viewportContainer">
    <div class="top-nav">
      <button onclick="closeViewer()">❌ Close</button>
      <input type="text" id="topNavInput" placeholder="URL or Search" />
      <button onclick="launchUrl(document.getElementById('topNavInput').value)">Go</button>
    </div>
    <iframe id="browserWindow" src="about:blank"></iframe>
  </div>

  <script>
    // Inline fallback for UV Config if uv.config.js is absent
    if (typeof __uv$config === 'undefined') {
      window.__uv$config = {
        prefix: '/uv/service/',
        bare: '/bare/',
        encodeUrl: typeof Ultraviolet !== 'undefined' ? Ultraviolet.codec.xor.encode : (str) => encodeURIComponent(str),
        decodeUrl: typeof Ultraviolet !== 'undefined' ? Ultraviolet.codec.xor.decode : (str) => decodeURIComponent(str),
        handler: '/uv/uv.handler.js',
        client: '/uv/uv.client.js',
        bundle: '/uv/uv.bundle.js',
        config: '/uv/uv.config.js',
        sw: '/uv/uv.sw.js',
      };
    }

    // Register Service Worker on load
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/uv/uv.sw.js', {
          scope: __uv$config.prefix
        }).then(() => {
          console.log('Ultraviolet Service Worker Registered');
        }).catch((err) => {
          console.error('Service Worker Registration Failed:', err);
        });
      });
    }

    function launchUrl(target) {
      if (!target) return;
      let url = target.trim();

      // Ensure URL protocol or format search engine URL
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          const selectedEngine = document.getElementById('engineSelect').value;
          if (selectedEngine === 'bing') {
            url = 'https://www.bing.com/search?q=' + encodeURIComponent(url);
          } else if (selectedEngine === 'duckduckgo') {
            url = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(url);
          } else {
            url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
          }
        }
      }

      // Encode URL and open iframe overlay
      const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
      document.getElementById('browserWindow').src = encodedUrl;
      document.getElementById('topNavInput').value = url;
      document.getElementById('viewportContainer').style.display = 'flex';
    }

    function closeViewer() {
      document.getElementById('browserWindow').src = 'about:blank';
      document.getElementById('viewportContainer').style.display = 'none';
    }

    function applyCloak(value) {
      const title = document.getElementById('tabTitle');
      const icon = document.getElementById('tabIcon');

      if (value === 'google') {
        title.innerText = 'Google';
        icon.href = 'https://www.google.com/favicon.ico';
      } else if (value === 'drive') {
        title.innerText = 'My Drive - Google Drive';
        icon.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
      } else if (value === 'classroom') {
        title.innerText = 'Classes';
        icon.href = 'https://ssl.gstatic.com/classroom/favicon.png';
      } else {
        title.innerText = 'Joe';
        icon.href = 'data:,';
      }
    }

    // Enter Key Listeners
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') launchUrl(e.target.value);
    });

    document.getElementById('topNavInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') launchUrl(e.target.value);
    });
  </script>
</body>
</html>
