<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="tabTitle">Joe</title>
  <link id="tabIcon" rel="icon" href="data:," />
  
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .main-container { width: 100%; max-width: 600px; padding: 24px; text-align: center; }
    h1 { font-size: 3.2rem; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 24px; color: #ffffff; }
    .options-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
    select {
      background: #09090b; color: #a1a1aa; border: 1px solid #27272a;
      padding: 10px 14px; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer;
    }
    select:hover, select:focus { border-color: #52525b; color: #ffffff; }
    .search-box {
      display: flex; gap: 8px; background: #09090b; padding: 6px;
      border-radius: 12px; border: 1px solid #27272a; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.8);
    }
    .search-box input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #ffffff; padding: 12px 16px; font-size: 15px;
    }
    .search-box input::placeholder { color: #52525b; }
    .search-box button {
      background: #ffffff; color: #000000; border: none; padding: 12px 24px;
      border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .search-box button:hover { background: #e4e4e7; }
    #viewportContainer {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000; flex-direction: column; z-index: 9999;
    }
    .top-nav {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #09090b; border-bottom: 1px solid #27272a;
    }
    .top-nav button {
      background: #18181b; color: #ffffff; border: 1px solid #27272a;
      padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .top-nav button:hover { background: #27272a; }
    .top-nav input {
      flex: 1; background: #000000; border: 1px solid #27272a; color: #ffffff;
      padding: 8px 14px; border-radius: 6px; font-size: 14px; outline: none;
    }
    iframe { flex: 1; width: 100%; height: 100%; border: none; background: #ffffff; }
  </style>
</head>
<body>

  <div class="main-container" id="homeContainer">
    <h1>Joe</h1>
    
    <div class="options-row">
      <select id="engineSelect">
        <option value="google">Search: Google</option>
        <option value="bing">Search: Bing</option>
        <option value="duckduckgo">Search: DuckDuckGo</option>
      </select>

      <select onchange="applyCloak(this.value)">
        <option value="default">Tab Cloak: Normal</option>
        <option value="google">Google</option>
        <option value="drive">Google Drive</option>
        <option value="classroom">Google Classroom</option>
      </select>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search the web or type a URL..." />
      <button onclick="launchUrl(document.getElementById('searchInput').value)">Go</button>
    </div>
  </div>

  <div id="viewportContainer">
    <div class="top-nav">
      <button onclick="closeViewer()">❌ Close</button>
      <input type="text" id="topNavInput" placeholder="URL or Search" />
      <button onclick="launchUrl(document.getElementById('topNavInput').value)">Go</button>
    </div>
    <iframe id="browserWindow" src="about:blank"></iframe>
  </div>

  <script>
    async function launchUrl(target) {
      if (!target) return;
      let url = target.trim();

      // Check if config loaded cleanly
      if (typeof window.__uv$config === 'undefined') {
        alert("Ultraviolet configuration is missing. Ensure dependencies were installed with 'npm install'.");
        return;
      }

      // 1. Immediately transition UI
      document.getElementById('homeContainer').style.display = 'none';
      document.getElementById('viewportContainer').style.display = 'flex';
      document.getElementById('topNavInput').value = url;

      // 2. Register Service Worker safely
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('/uv/uv.sw.js', {
            scope: window.__uv$config.prefix
          });
        } catch (err) {
          console.error("SW Registration error:", err);
        }
      }

      // 3. Process URL / Search query
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          const selectedEngine = document.getElementById('engineSelect').value;
          if (selectedEngine === 'bing') {
            url = 'https://www.bing.com/search?q=' + encodeURIComponent(url);
          } else if (selectedEngine === 'duckduckgo') {
            url = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(url);
          } else {
            url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
          }
        }
      }

      // 4. Update iframe source
      document.getElementById('browserWindow').src = window.__uv$config.prefix + window.__uv$config.encodeUrl(url);
    }

    function closeViewer() {
      document.getElementById('browserWindow').src = 'about:blank';
      document.getElementById('viewportContainer').style.display = 'none';
      document.getElementById('homeContainer').style.display = 'block';
    }

    function applyCloak(value) {
      const title = document.getElementById('tabTitle');
      const icon = document.getElementById('tabIcon');

      if (value === 'google') {
        title.innerText = 'Google';
        icon.href = 'https://www.google.com/favicon.ico';
      } else if (value === 'drive') {
        title.innerText = 'My Drive - Google Drive';
        icon.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
      } else if (value === 'classroom') {
        title.innerText = 'Classes';
        icon.href = 'https://ssl.gstatic.com/classroom/favicon.png';
      } else {
        title.innerText = 'Joe';
        icon.href = 'data:,';
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') launchUrl(e.target.value);
    });

    document.getElementById('topNavInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') launchUrl(e.target.value);
    });
  </script>
</body>
</html>
